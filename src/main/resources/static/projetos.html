<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><title>Projetos</title><style>body{font-family:Arial;background:#f5f5f5;padding:20px}.container{max-width:1000px;margin:auto}.card,header{background:#fff;padding:24px;border-radius:10px;margin-bottom:20px}input,button{padding:10px;margin:5px;border-radius:5px}input{width:90%}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #ddd}.primary{background:#07c;color:#fff}.danger{background:#d33;color:#fff}</style></head><body><div class="container"><header><h1>Projetos</h1><button onclick="location.href='empregados.html'">Empregados</button><button onclick="logout()">Sair</button></header><div id="message"></div><div class="card"><form id="form"><input type="hidden" id="id"><label>Nome</label><br><input id="nome" required maxlength="100"><br><label>Data de criação</label><br><input id="dataCriacao" type="date" required><br><button class="primary">Salvar</button><button type="button" onclick="limpar()">Cancelar</button></form></div><div class="card"><table><thead><tr><th>Nome</th><th>Data</th><th>Ações</th></tr></thead><tbody id="lista"></tbody></table></div></div><script src="js/projetos.js"></script></body></html>
